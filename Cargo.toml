[workspace]
resolver = "2"
members = [
    "crates/oxiblas-core",
    "crates/oxiblas-matrix",
    "crates/oxiblas-blas",
    "crates/oxiblas-lapack",
    "crates/oxiblas",
    "crates/oxiblas-ndarray",
    "crates/oxiblas-sparse",
    "crates/oxiblas-benchmarks",
]
# oxiblas-ffi is retired (v0.2.0 Pure Rust pivot): unbuilt, untested by CI,
# not part of the shipped product. Structurally excluded so it can never be
# accidentally pulled in by --workspace / --all or a future members-list edit.
#
# fuzz/ is its own independent `[workspace]` (see fuzz/Cargo.toml) and needs
# libfuzzer-sys + a nightly toolchain; excluding it here too means a plain
# `cargo build`/`cargo clippy --workspace` from the root never touches it.
# Build/run fuzz targets explicitly: `cd fuzz && cargo +nightly fuzz run <target>`.
exclude = ["crates/oxiblas-ffi", "fuzz"]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiblas"
authors = ["COOLJAPAN OU <contact@cooljapan.tech>"]

[workspace.dependencies]
# Internal crates
oxiblas-core = { path = "crates/oxiblas-core", version = "0.2.3", default-features = false }
oxiblas-matrix = { path = "crates/oxiblas-matrix", version = "0.2.3", default-features = false }
oxiblas-blas = { path = "crates/oxiblas-blas", version = "0.2.3" }
oxiblas-lapack = { path = "crates/oxiblas-lapack", version = "0.2.3" }
oxiblas-sparse = { path = "crates/oxiblas-sparse", version = "0.2.3" }
oxiblas = { path = "crates/oxiblas", version = "0.2.3" }
oxiblas-ndarray = { path = "crates/oxiblas-ndarray", version = "0.2.3" }
# oxiblas-ffi has been retired as of v0.2.0 (Pure Rust ecosystem)

# Essential dependencies
# `default-features = false` + `libm` keeps `oxiblas-core` / `oxiblas-matrix`
# buildable on real no_std targets. Their `std` features re-enable
# `num-traits/std` + `num-complex/std`, which take precedence over `libm`, so
# default (std) builds keep using the std float intrinsics bit-for-bit.
num-complex = { version = "0.4", default-features = false, features = ["bytemuck", "libm"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
bytemuck = { version = "1.25", features = ["derive"] }

# Optional dependencies
rayon = "1.12"
ndarray = "0.17"
nalgebra = "0.35"
# no_std-capable like num-traits above; `oxiblas-core/std` re-enables their `std`.
twofloat = { version = "0.8", default-features = false, features = ["math_funcs"] }
half = { version = "2.7", default-features = false, features = ["num-traits", "bytemuck"] }
serde = { version = "1.0", features = ["std", "derive"] }
serde_json = "1.0"
memmap2 = "0.9"
libc = "0.2"

# Dev dependencies
# `rayon` is enabled per-crate for non-wasm32 targets only (criterion refuses
# rayon on wasm32), see each crate's target-specific dev-dependencies.
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
rand = "0.10"
approx = "0.5"
quickcheck = "1.1"
quickcheck_macros = "1.2"
faer = "0.24"

# oxiblas-benchmarks' opt-in `compare-openblas` feature only (see that
# crate's Cargo.toml comment) — never reached by any default or
# non-default feature of a publishable crate.
ndarray-linalg = "0.18"
blas-src = "0.14"
cblas-sys = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "allow"  # Rust 2024 defaults to requiring unsafe blocks; we allow for now

[workspace.lints.clippy]
all = "warn"
# Pedantic and nursery are disabled by default - too many false positives
# for numerical code with BLAS naming conventions
# pedantic = "warn"
# nursery = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
