[package]
name = "oxiblas-blas"
description = "BLAS operations for OxiBLAS - pure Rust implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["blas", "gemm", "linear-algebra", "simd", "matrix"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
oxiblas-core.workspace = true
oxiblas-matrix.workspace = true
num-complex.workspace = true
num-traits.workspace = true
bytemuck.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["oxiblas-core/std", "oxiblas-matrix/std"]
parallel = ["rayon", "oxiblas-core/parallel"]
runtime-tuning = ["oxiblas-core/std"]

# SIMD control features (propagate to oxiblas-core)
force-scalar = ["oxiblas-core/force-scalar"]  # Disable all SIMD
max-simd-128 = ["oxiblas-core/max-simd-128"]  # Limit to 128-bit SIMD
max-simd-256 = ["oxiblas-core/max-simd-256"]  # Limit to 256-bit SIMD

# Opt-in SME2 backend for Arm CPUs with SME2 and a 512-bit streaming vector
# length (Apple M4 and later). Off by default until it has been validated on
# SME2 hardware; compiles to nothing on targets other than aarch64, and stays
# off at run time under force-scalar / max-simd-128 / max-simd-256.
sme2 = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
